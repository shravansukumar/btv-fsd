# Unified stack: PostgreSQL + Django (DRF) + React (Vite).
#
#   docker compose up --build
#
# Then open:
#   Frontend  -> http://localhost:5173
#   Backend   -> http://localhost:8000  (API under /api, admin at /admin)
#
# Source is bind-mounted into the backend/frontend containers, so edits on the
# host hot-reload inside the containers. The database persists in a volume.
services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
    volumes:
      # Postgres 18+ stores data in a version subdirectory; mount the parent.
      - pgdata:/var/lib/postgresql
    # Reachable by other services over the internal network (by hostname `db`,
    # port 5432), and bound to 127.0.0.1:5433 on the host for local debugging
    # only — never published to the machine's external interfaces. Host port is
    # 5433 to avoid clashing with a local Postgres already on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "1"
      USE_SQLITE: "0"
      POSTGRES_DB: clinic
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - appnet
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      # The Vite proxy (running inside this container) reaches Django by service name.
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules; don't let the bind mount hide it.
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - appnet
    depends_on:
      - backend

networks:
  appnet:
    driver: bridge

volumes:
  pgdata:
